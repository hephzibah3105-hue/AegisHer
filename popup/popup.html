<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisHer AI Protection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 18px;
      user-select: none;
    }

    .popup-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 10px;
      color: #64748b;
      font-weight: 500;
    }

    /* Toggle Switch Card */
    .toggle-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .toggle-info h2 {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }

    .toggle-info p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Toggle switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked+.slider {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    input:checked+.slider:before {
      transform: translateX(22px);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }

    .stat-card:nth-child(2) .stat-val {
      color: #f59e0b;
    }

    .stat-card:nth-child(3) .stat-val {
      color: #ef4444;
    }

    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Navigation Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .footer-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #10b981;
      margin-top: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>

<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <div class="logo-icon">🛡️</div>
        <div>
          <div class="brand-name">AegisHer AI</div>
          <div class="version">Protection Suite v1.0</div>
        </div>
      </div>
    </div>

    <!-- Active Shield Toggle -->
    <div class="toggle-card">
      <div class="toggle-info">
        <h2 id="shield-status-title">Shield Protection: ON</h2>
        <p id="shield-status-sub">Real-time threat interception active</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="shield-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Honeypot Bot Alert Banner -->
    <div id="honeypot-alert-banner" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; padding: 12px 14px; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); margin-bottom: 4px;">
      <span style="font-size: 20px;">🤖</span>
      <div style="flex: 1;">
        <div style="font-size: 12px; font-weight: 700; color: #f87171;">Honeypot Trap Triggered!</div>
        <div style="font-size: 10px; color: #cbd5e1; margin-top: 1.5px;">Active page isolation blocking credential harvesting scripts.</div>
      </div>
      <button id="dismiss-badge-btn" style="background: rgba(255, 255, 255, 0.1); border: none; color: #fff; border-radius: 4px; padding: 3px 7px; font-size: 9px; font-weight: 700; cursor: pointer;">Clear</button>
    </div>

    <!-- Blocked Stats Counter -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-scanned">0</div>
        <div class="stat-label">Links Scanned</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-intercepted">0</div>
        <div class="stat-label">Risks Blocked</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-vaulted">0</div>
        <div class="stat-label">Vaulted Evidence</div>
      </div>
    </div>

    <!-- Direct Navigation Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="open-vault-btn">
        <span>🔐 Open Evidence Vault</span>
      </button>
      <button class="btn btn-secondary" id="open-dashboard-btn">
        <span>📊 Open Aegis Dashboard</span>
      </button>
    </div>

    <div class="footer-status">
      <span class="status-dot"></span>
      <span>System Operational & Monitoring</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
